[project]
name = "av-tokenvault-backend"
version = "0.1.0"
description = "FastAPI backend for the AV-TokenVault local prototype."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "sqlalchemy>=2.0,<2.1",
  "pydantic-settings>=2.8,<2.9",
  "python-multipart>=0.0.20,<0.1",
  "pillow>=11.0,<12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.28,<0.29",
]
models = [
  "faster-whisper>=1.2,<2",
  "sentence-transformers>=5.0,<6",
  "open-clip-torch>=3.0,<4",
  "msclap>=1.3,<2",
  "torchcodec>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
